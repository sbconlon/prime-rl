# ACTION-LEVEL ARM 1.5B — ALFWorld on Bocconi cluster (gnode02/04)
# PATH C — pick_and_place_simple ONLY warm-start, WITH THE TRAINING-TIME PROBE.
# Run lineage: warm-003-pps-probe (= warm-002-pps + the probe block, training-probe Phase 5).
# Branch: feature/action-level-arm.
#
# Identical to arm_action_1.5b_sft_ctx2048_pps_warm.toml except:
#   * [orchestrator.eval*] removed, [orchestrator.probe*] added (training-probe D-2: the probe
#     replaces the online eval; it emits eval/alfworld-probe/avg@1 and friends).
#   * new output_dir / LoRA name / advantage_trainer.output_dir (fresh run dir).
#   * args.pi_hat_renorm = false on the train AND probe envs (D-13; see the NOTE below).
# NOTE: this is the first RL run after the min_p fix (prime-rl d9a72abb): [orchestrator.sampling.extra_body]
# min_p = 0.1 now reaches vLLM, so training rollouts sample at T=0.8 / min_p=0.1 for the first time
# (every earlier run sampled at min_p=0). The probe's m sampled blocks use the same regime.
# NOTE (2026-11-07, training-probe D-13): pi_hat is NOT renormalized over the admissible set in
# this run (args.pi_hat_renorm = false on both envs). pi_hat(a*) is the raw probability of emitting
# the action string under each sampled block (mean over blocks), so A(a*) carries the extra term
# -log(admissible mass). The probe records exp(Z) per block, and the round metric
# probe/admissible_mass_mean reports it, so the size of the dropped normalizer is measured directly.
# NOTE (2026-11-07, two-slice layout): the stud QOS now grants gres/gpu=2 per user (was 4), so the
# sbatch requests 2 MIG slices and sets PRIME_RL_PHYSICAL_GPU_IDS=0,1,0,1: inference + Advantage
# Server share slice 0, trainer + Advantage Trainer share slice 1. vLLM's gpu_memory_utilization
# is lowered to 0.45 (warm-002 used 0.70 = 28 GB of a 40 GB slice, 22.7 GB of KV cache for 851k
# tokens it never needed) to leave the Advantage Server's backbone + Q+ forwards room on slice 0.

max_steps = 500
seq_len = 17408
output_dir = "/home/3312841/runs/arm-action-1.5b-sft-ctx2048-warm-003-pps-probe"

# W&B disabled (setup_monitor builds no WandbMonitor when [wandb] is absent). Probe metrics go to
# the orchestrator log + monitor history; the records go to <output_dir>/probes/.

[model]
name = "/home/3312841/sft/checkpoint/step_40"

[trainer.model]
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
fused_lm_head_token_chunk_size = 1024

[trainer.model.ac]
mode = "full"
freq = 1

[ckpt]
interval = 5
keep_last = 1
resume_step = -1

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[trainer.optim]
lr = 1e-5

[trainer.model.lora]
rank = 64
alpha = 128.0
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[trainer.ckpt]
skip_gather_master_weights = false

[trainer.ckpt.weights]
save_adapter_separately = true

[orchestrator]
batch_size = 16
max_inflight_rollouts = 16
rollouts_per_example = 4
algorithm = "arm"
# REQUIRED for action-level: π̂ scoring uses the token client (use_token_client=true).
use_token_client = true
filters = [
  { type = "gibberish", enforce = true, token_id_threshold = 100000, logprob_offset = 2.0 },
  { type = "repetition", enforce = true, window = 3000, prob_threshold = 0.99 },
]

[orchestrator.advantage_server]
base_url = "http://127.0.0.1:8200"

[orchestrator.buffer]
curriculum = [100, 100, 100]
adaptive_advance_threshold = 0.30
adaptive_window_size = 20
online_difficulty_filtering = false

[orchestrator.sampling]
max_tokens = 512
temperature = 0.8

[orchestrator.sampling.extra_body]
min_p = 0.1

[orchestrator.model.lora]
name = "arm-action-1.5b-sft-ctx2048-warm-003-pps-probe"

[[orchestrator.env]]
id = "alfworld-env"
name = "alfworld-train"
num_workers = 1
args.data_path = "/home/3312841/.cache/alfworld/json_2.1.1"
args.split = "train"
args.max_context_tokens = 2048
args.tokenizer_path = "/home/3312841/sft/checkpoint/step_40"
args.max_turns = 15
args.num_reasoning_blocks = 2
args.prewarm_pi_hat_prefixes = false
args.pi_hat_renorm = false
args.curriculum = [
  { pick_and_place_simple = 1.0, default = 0.0 },
  { pick_and_place_simple = 0.2, pick_two_obj_and_place = 0.2, pick_clean_then_place_in_recep = 0.2, pick_cool_then_place_in_recep = 0.2, pick_heat_then_place_in_recep = 0.2, default = 0.0 },
  { default = 1.0 },
]

# ---------------------------------------------------------------------------
# Training-time probe (training-probe plan). Replaces [orchestrator.eval] (D-2).
# Every 10 policy checkpoint steps (+ ckpt 0 = the SFT policy with the warm value nets, + a final
# round): 24 probe games, greedy executed response, m=2 sampled blocks at the training regime,
# handcoded oracle, one JSON per rollout under <output_dir>/probes/ckpt_<k>/ + index.jsonl.
# Bundle on the laptop with cluster-files/probe-hud/bundle_probes.py, view with hud.html.
# ---------------------------------------------------------------------------
[orchestrator.probe]
interval = 10
probe_base_model = true
skip_probe_on_resume = true
output_subdir = "probes"
max_retries = 0
emit_eval_metrics = true

[orchestrator.probe.sampling]
max_tokens = 512
temperature = 0.0

[orchestrator.probe.env]
id = "alfworld-env"
name = "alfworld-probe"
args.data_path = "/home/3312841/.cache/alfworld/json_2.1.1"
args.probe_set = "alfworld-24-v1"
args.probe_capture = true
args.num_reasoning_blocks = 2
args.probe_block_temperature = 0.8
args.probe_block_min_p = 0.1
args.oracle = "handcoded"
args.max_context_tokens = 2048
args.tokenizer_path = "/home/3312841/sft/checkpoint/step_40"
args.max_turns = 15
args.prewarm_pi_hat_prefixes = false
args.pi_hat_renorm = false

[inference]
enable_lora = true
enable_prefix_caching = true
# 0.70 on a dedicated slice (warm-002); 0.45 when sharing the slice with the Advantage Server.
gpu_memory_utilization = 0.45

[inference.vllm_extra]
max_logprobs = 8
max_num_batched_tokens = 8192

[inference.model]
max_model_len = 3072

[inference.parallel]
tp = 1

[advantage_server]
model_name = "/home/3312841/sft/checkpoint/step_40"
host = "127.0.0.1"
port = 8200
gamma = 1.0
arm_phi_decay = 0.9
# WARM-START (both-warm invariant): MUST be byte-identical to advantage_trainer.warm_start_path.
warm_start_path = "/home/3312841/warmstart/pps/value_nets_pps/checkpoints/step_0/trainer/value_state.pt"

[advantage_server.lora]
rank = 16
alpha = 32.0
dropout = 0.0

[advantage_trainer]
algorithm = "arm"
max_steps = 500
learning_rate = 5e-4
n_epochs = 1
minibatch_size = 32
inner_batch_size = 2
output_dir = "/home/3312841/runs/arm-action-1.5b-sft-ctx2048-warm-003-pps-probe/advantage_trainer"
warm_start_path = "/home/3312841/warmstart/pps/value_nets_pps/checkpoints/step_0/trainer/value_state.pt"

[advantage_trainer.model]
base_model_name = "/home/3312841/sft/checkpoint/step_40"
polyak_tau = 0.005

[advantage_trainer.model.lora]
rank = 16
alpha = 32.0
dropout = 0.0

[advantage_trainer.ckpt]
interval = 5
keep_last = 1
resume_step = -1
