# ACTION-LEVEL ARM 1.5B -- ALFWorld on Bocconi cluster. ARM REDESIGN, RUN A (no branching)
# (KB plan/arm-redesign, Phase 5). Branch: feature/action-level-arm.
#
# Generated by cluster-files/arm-redesign/gen_run_configs.py from
# branched-dataset/arm_action_1.5b_sft_ctx2048_pps_warm_branched_probe.toml (the probed run
# warm-003-pps-probe plus the branched warm start). Differences from that parent, all of them:
#   * max_steps 100 (policy and Advantage Trainer); fresh run dir / LoRA name (arm-redesign-a-001).
#   * value networks: value_nets_v3, final state (held-out contrast 0.713), on both value paths.
#   * [advantage_server] the new advantage and target rule (plan D-3, D-5, D-6):
#       arm_action_advantage_form = "difference", arm_margin = 0.10, arm_anchor = 0.3,
#       arm_target_form = "average", n_step = 15 (= max_turns, so g is the real outcome).
#   * [advantage_trainer] the offline trainer's optimizer fixes, switched on online (plan D-10):
#       fp32_master, head_learning_rate 1e-5, learning_rate 1e-4 (was 5e-4), max_grad_norm 1.0
#       per group, warmup_cycles 10; weights-only value milestones (plan D-9; every 10 steps in
#       run A, at step 2 in the trial).
#   * probe: the pick_and_place_simple set alfworld-pps-24-v1, every 10 steps.
# NO branching in run A: 16 trunks per step, 4 per game, as the parent.
# With max_steps = 100 the curriculum stays in stage 0 (pick_and_place_simple only).
# The gate of the branched-dataset plan is retired (plan D-19); the four metrics and the pass
# lines of phase-05-pass-lines-and-runs.md judge the run.

max_steps = 100
seq_len = 17408
output_dir = "/home/3312841/runs/arm-redesign-a-001"

# W&B disabled (setup_monitor builds no WandbMonitor when [wandb] is absent). Probe metrics go to
# the orchestrator log + monitor history; the records go to <output_dir>/probes/.

[model]
name = "/home/3312841/sft/checkpoint/step_40"

[trainer.model]
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
fused_lm_head_token_chunk_size = 1024

[trainer.model.ac]
mode = "full"
freq = 1

[ckpt]
interval = 5
keep_last = 1
resume_step = -1

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[trainer.optim]
lr = 1e-5

[trainer.model.lora]
rank = 64
alpha = 128.0
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[trainer.ckpt]
skip_gather_master_weights = false

[trainer.ckpt.weights]
save_adapter_separately = true

[orchestrator]
batch_size = 16
max_inflight_rollouts = 16
rollouts_per_example = 4
algorithm = "arm"
# REQUIRED for action-level: π̂ scoring uses the token client (use_token_client=true).
use_token_client = true
filters = [
  { type = "gibberish", enforce = true, token_id_threshold = 100000, logprob_offset = 2.0 },
  { type = "repetition", enforce = true, window = 3000, prob_threshold = 0.99 },
]

[orchestrator.advantage_server]
base_url = "http://127.0.0.1:8200"

[orchestrator.buffer]
curriculum = [100, 100, 100]
adaptive_advance_threshold = 0.30
adaptive_window_size = 20
online_difficulty_filtering = false

[orchestrator.sampling]
max_tokens = 512
temperature = 0.8

[orchestrator.sampling.extra_body]
min_p = 0.1

[orchestrator.model.lora]
name = "arm-redesign-a-001"

[[orchestrator.env]]
id = "alfworld-env"
name = "alfworld-train"
num_workers = 1
args.data_path = "/home/3312841/.cache/alfworld/json_2.1.1"
args.split = "train"
args.max_context_tokens = 2048
args.tokenizer_path = "/home/3312841/sft/checkpoint/step_40"
args.max_turns = 15
args.num_reasoning_blocks = 2
args.prewarm_pi_hat_prefixes = false
args.pi_hat_renorm = false
args.curriculum = [
  { pick_and_place_simple = 1.0, default = 0.0 },
  { pick_and_place_simple = 0.2, pick_two_obj_and_place = 0.2, pick_clean_then_place_in_recep = 0.2, pick_cool_then_place_in_recep = 0.2, pick_heat_then_place_in_recep = 0.2, default = 0.0 },
  { default = 1.0 },
]

# ---------------------------------------------------------------------------
# Training-time probe (training-probe plan). Replaces [orchestrator.eval] (D-2).
# Every 10 policy checkpoint steps (+ ckpt 0 = the SFT policy with the warm value nets, + a final
# round): 24 probe games, greedy executed response, m=2 sampled blocks at the training regime,
# handcoded oracle, one JSON per rollout under <output_dir>/probes/ckpt_<k>/ + index.jsonl.
# Bundle on the laptop with cluster-files/probe-hud/bundle_probes.py, view with hud.html.
# ---------------------------------------------------------------------------
[orchestrator.probe]
interval = 10
probe_base_model = true
skip_probe_on_resume = true
output_subdir = "probes"
max_retries = 0
emit_eval_metrics = true

[orchestrator.probe.sampling]
max_tokens = 512
temperature = 0.0

[orchestrator.probe.env]
id = "alfworld-env"
name = "alfworld-probe"
args.data_path = "/home/3312841/.cache/alfworld/json_2.1.1"
args.probe_set = "alfworld-pps-24-v1"
args.probe_capture = true
args.num_reasoning_blocks = 2
args.probe_block_temperature = 0.8
args.probe_block_min_p = 0.1
args.oracle = "handcoded"
args.max_context_tokens = 2048
args.tokenizer_path = "/home/3312841/sft/checkpoint/step_40"
args.max_turns = 15
args.prewarm_pi_hat_prefixes = false
args.pi_hat_renorm = false

[inference]
enable_lora = true
enable_prefix_caching = true
# 0.70 on a dedicated slice (warm-002); 0.45 when sharing the slice with the Advantage Server.
gpu_memory_utilization = 0.45

[inference.vllm_extra]
max_logprobs = 8
max_num_batched_tokens = 8192

[inference.model]
max_model_len = 3072

[inference.parallel]
tp = 1

[advantage_server]
model_name = "/home/3312841/sft/checkpoint/step_40"
host = "127.0.0.1"
port = 8200
gamma = 1.0
arm_phi_decay = 0.9
# ARM redesign (plan D-3, D-5, D-6): anchored regret matching, difference form; the Q+
# target stores the average of regret; the return is the episode's real outcome.
arm_action_advantage_form = "difference"
arm_margin = 0.10
arm_anchor = 0.3
arm_target_form = "average"
n_step = 15
# WARM-START (both-warm invariant): MUST be byte-identical to advantage_trainer.warm_start_path.
warm_start_path = "/home/3312841/branched/pps/value_nets_v3/checkpoints/step_0/trainer/value_state.pt"

[advantage_server.lora]
rank = 16
alpha = 32.0
dropout = 0.0

[advantage_trainer]
algorithm = "arm"
max_steps = 100
# ARM redesign (plan D-10): the offline trainer's optimizer fixes, switched on online.
# LoRA 1e-4, heads 1e-5 in their own groups, each group clipped at 1.0, float32 master
# weights and Adam state, a ten-cycle warmup.
learning_rate = 1e-4
head_learning_rate = 1e-5
max_grad_norm = 1.0
warmup_cycles = 10
fp32_master = true
# Weights-only copies of the value networks every 10 steps (111 MB each), scored on
# the held-out pairs after the run (plan D-9).
milestone_every_steps = 10
n_epochs = 1
minibatch_size = 32
inner_batch_size = 2
output_dir = "/home/3312841/runs/arm-redesign-a-001/advantage_trainer"
warm_start_path = "/home/3312841/branched/pps/value_nets_v3/checkpoints/step_0/trainer/value_state.pt"

[advantage_trainer.model]
base_model_name = "/home/3312841/sft/checkpoint/step_40"
polyak_tau = 0.005

[advantage_trainer.model.lora]
rank = 16
alpha = 32.0
dropout = 0.0

[advantage_trainer.ckpt]
interval = 5
keep_last = 1
resume_step = -1
