# Warm-start V and Q+ on the BRANCHED dataset (plan branched-dataset, Phase 3/5):
#   uv run warmstart-train @ configs/value-warmstart/branch-train.toml
# Same backbone, LoRA, learning rates, and batch shape as the single-action warm-start
# (warmstart-train.toml), so the ablation changes one thing: the data. Records tagged
# holdout=True by branch-collect (the last 50 games) are excluded from training and
# listed in output_dir/holdout.json; contrast_eval reads them for the gate's G-A.

v_learning_rate = 3e-4
q_plus_learning_rate = 1e-3
max_epochs = 20
output_dir = "/home/3312841/branched/pps/value_nets_branched"

[model]
base_model_name = "/home/3312841/sft/checkpoint/step_40"

[model.lora]
rank = 16
alpha = 32.0
dropout = 0.0

[data]
kind = "branched"
path = "/home/3312841/branched/pps/full/records.msgpack"
batch_size = 32
inner_batch_size = 2
