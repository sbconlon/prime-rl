# Offline value warm-start (Phase 3): `uv run warmstart-train @ warmstart-train.toml`.
# Regress V and Q+ on the MC-return dataset from warmstart-collect; emit value_state.pt.

# PATH B fix: v_lr 1e-3 -> 3e-4. The V loss oscillated (0.15/0.087/0.208/0.114) at 1e-3
# while Q+ converged cleanly -> V lr was too high. 3e-4 stabilizes V convergence. (Q+
# keeps 1e-3, it converged.) Per-epoch save is on; watch l_v flatten and scancel.
v_learning_rate = 3e-4
q_plus_learning_rate = 1e-3
max_epochs = 20
output_dir = "/home/3312841/warmstart/pps/value_nets_pps"

[model]
base_model_name = "/home/3312841/sft/checkpoint/step_40"

[model.lora]
rank = 16
alpha = 32.0
dropout = 0.0

[data]
path = "/home/3312841/warmstart/pps/warmstart_pps.msgpack"
batch_size = 32
# inner_batch_size = per-forward chunk (batch_size=32 is the outer grad-accumulation
# and does NOT drive memory). 8 OOM'd the 40GB MIG slice at 38.9 GiB in the V forward;
# the RL AdvTrainer runs the identical shared-legs forward at 2 and fits. Drop to 2.
inner_batch_size = 2
