# Phase 10 -- standalone Advantage Trainer config (Phase 7).
#
# This file mirrors the [advantage_trainer] section of start.toml. The launcher
# itself only consumes start.toml and renders the per-subprocess configs to
# <output_dir>/configs/ at runtime (see Phase 7c's write_subconfigs, which
# additionally injects launcher-wired transport_input_dir and
# advantage_server_url overrides); this standalone file exists per the
# Phase 10 doc so the subprocess configs are also checked in as discoverable
# artifacts.

algorithm = "arm"
max_steps = 20
learning_rate = 1e-3

[model]
base_model_name = "PrimeIntellect/Qwen3-0.6B-Reverse-Text-SFT"
polyak_tau = 0.005

[model.lora]
rank = 16
alpha = 32.0
dropout = 0.0
